name: CI & Architecture Verification

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-verification:
    name: Backend Tests & Architecture Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: movie_prod_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movie_prod_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: cgr.dev/chainguard/minio:latest
        env:
          MINIO_ROOT_USER: studio_admin
          MINIO_ROOT_PASSWORD: studio_password
        ports:
          - 9000:9000
        command: server /data

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: movie_prod_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: movie_prod_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      REDIS_URL: redis://127.0.0.1:6379/0
      AWS_ACCESS_KEY_ID: studio_admin
      AWS_SECRET_ACCESS_KEY: studio_password
      AWS_STORAGE_BUCKET_NAME: studio-media
      AWS_S3_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_S3_CUSTOM_DOMAIN: localhost:9000/studio-media
      SECRET_KEY: "ci-secret-key-for-testing"
      DJANGO_SECRET_KEY: "ci-secret-key-for-testing"
      DEBUG: "True"
      DJANGO_DEBUG: "True"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure infrastructure readiness and initialize MinIO bucket
        run: |
          python -c "
          import time, socket, boto3

          def wait_for_port(host, port, name, timeout=30):
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection((host, port), timeout=1):
                          return
                  except OSError:
                      time.sleep(1)
              raise RuntimeError(f'Timed out waiting for {name} on {host}:{port}')

          wait_for_port('127.0.0.1', 6379, 'Redis')
          wait_for_port('127.0.0.1', 9000, 'MinIO')

          s3 = boto3.client(
              's3',
              endpoint_url='http://127.0.0.1:9000',
              aws_access_key_id='studio_admin',
              aws_secret_access_key='studio_password',
          )
          buckets = [b['Name'] for b in s3.list_buckets().get('Buckets', [])]
          if 'studio-media' not in buckets:
              s3.create_bucket(Bucket='studio-media')
          print('Redis and MinIO verified; studio-media bucket initialized.')
          "

      - name: Verify Backend Architecture Boundaries
        working-directory: ./backend
        run: |
          python scripts/check_architecture.py

      - name: Run Backend Tests
        working-directory: ./backend
        run: |
          python manage.py test

  frontend-verification:
    name: Frontend Verification & Architecture Boundary Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Verify Frontend Architecture Boundaries
        working-directory: ./frontend
        run: |
          npm run check:architecture

      - name: Type Check (tsc)
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Run Linter
        working-directory: ./frontend
        run: |
          npm run lint
