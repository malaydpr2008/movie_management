name: CI & Architecture Verification

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-verification:
    name: Backend Tests & Architecture Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: movie_prod_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movie_prod_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: movie_prod_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: movie_prod_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      SECRET_KEY: "ci-secret-key-for-testing"
      DJANGO_SECRET_KEY: "ci-secret-key-for-testing"
      DEBUG: "True"
      DJANGO_DEBUG: "True"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Architecture Boundaries
        working-directory: ./backend
        run: |
          python scripts/check_architecture.py

      - name: Run Backend Tests
        working-directory: ./backend
        run: |
          python manage.py test

  frontend-verification:
    name: Frontend Verification & Architecture Boundary Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Verify Frontend Architecture Boundaries
        working-directory: ./frontend
        run: |
          npm run check:architecture

      - name: Type Check (tsc)
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Run Linter
        working-directory: ./frontend
        run: |
          npm run lint
