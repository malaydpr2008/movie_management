name: CI & Architecture Verification

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-verification:
    name: Backend Tests & Architecture Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Architecture Boundaries
        working-directory: ./backend
        run: |
          python scripts/check_architecture.py

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          SECRET_KEY: "ci-secret-key-for-testing"
          DEBUG: "True"
        run: |
          python manage.py test

  frontend-verification:
    name: Frontend Verification & Architecture Boundary Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Verify Frontend Architecture Boundaries
        working-directory: ./frontend
        run: |
          npm run check:architecture

      - name: Type Check (tsc)
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Run Linter
        working-directory: ./frontend
        run: |
          npm run lint
